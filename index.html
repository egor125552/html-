<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интеллектуальное Подавление Хлопков</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/audio@latest/dist/teachablemachine-audio.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.8em;
            margin-bottom: 20px;
        }
        #status {
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: bold;
            color: #555;
            min-height: 25px;
        }
        input[type="file"] {
            display: none;
        }
        .file-upload-label {
            display: inline-block;
            padding: 12px 20px;
            font-size: 1em;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .file-upload-label:hover {
            background-color: #0056b3;
        }
        #run-button {
            padding: 12px 20px;
            font-size: 1em;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            margin-left: 10px;
            transition: background-color 0.3s, opacity 0.3s;
        }
        #run-button:hover:not(:disabled) {
            background-color: #218838;
        }
        #run-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Подавление импульсного шума (хлопков)</h1>
        <label for="zip-upload" class="file-upload-label">Загрузить ZIP-модель</label>
        <input type="file" id="zip-upload" accept=".zip">
        <button id="run-button" disabled>Запустить анализ</button>
        <div id="status">Ожидание загрузки ZIP-архива...</div>
    </div>

    <script>
        console.log('скрипт запущен');
        const statusDiv = document.getElementById('status');
        const zipUploadInput = document.getElementById('zip-upload');
        const runButton = document.getElementById('run-button');

        let model, recognizer, noiseGateWorklet;
        let modelURL, metadataURL;

        // --- 1. Логика AudioWorklet ---
        const audioWorkletCode = `
            class DynamicClapGateProcessor extends AudioWorkletProcessor {
                constructor() {
                    super();
                    this.targetGain = 1.0;
                    this.currentGain = 1.0;
                    this.attackTime = 0.005; // 5ms to ramp down
                    this.releaseTime = 0.08; // 80ms to ramp up
                    this.holdTime = 0.08;    // 80ms hold low
                    this.holdTimer = 0;
                    this._clapDetected = false; // Флаг для безопасной активации

                    this.port.onmessage = (event) => {
                        if (event.data.type === 'CLAP_DETECTED') {
                            // Просто устанавливаем флаг, не используем sampleRate здесь
                            this._clapDetected = true;
                        }
                    };
                }

                process(inputs, outputs, parameters) {
                    // Проверяем флаг здесь, где sampleRate гарантированно доступен
                    if (this._clapDetected) {
                        this.holdTimer = this.holdTime * sampleRate;
                        this._clapDetected = false; // Сбрасываем флаг
                    }

                    const input = inputs[0];
                    const output = outputs[0];

                    // Если таймер активен, держим гейт закрытым
                    if (this.holdTimer > 0) {
                        this.holdTimer -= 128; // 128 - размер блока по умолчанию
                        this.targetGain = 0.01; // Целевая громкость - почти тишина
                    } else {
                        this.targetGain = 1.0; // Возвращаем громкость к нормальной
                    }

                    // Плавное изменение громкости (ramping)
                    for (let channel = 0; channel < input.length; channel++) {
                        const inputChannel = input[channel];
                        const outputChannel = output[channel];
                        for (let i = 0; i < inputChannel.length; i++) {
                            // Простое линейное приближение для плавности
                            this.currentGain += (this.targetGain - this.currentGain) * (this.targetGain < this.currentGain ? this.attackTime : this.releaseTime);
                            outputChannel[i] = inputChannel[i] * this.currentGain;
                        }
                    }

                    return true; // Продолжаем обработку
                }
            }
            registerProcessor('dynamic-clap-gate', DynamicClapGateProcessor);
        `;

        // --- 2. Обработка загрузки ZIP ---
        zipUploadInput.addEventListener('change', async (event) => {
            console.log('ZIP-файл выбран');
            const file = event.target.files[0];
            if (!file) {
                console.log('Файл не выбран');
                return;
            }

            statusDiv.textContent = 'Распаковка ZIP-архива...';
            console.log('Начало распаковки...');
            try {
                const jszip = new JSZip();
                const zip = await jszip.loadAsync(file);
                console.log('ZIP-архив загружен в JSZip');

                const modelJsonBlob = await zip.file('model.json').async('blob');
                console.log('Извлечен model.json');
                const weightsBinBlob = await zip.file('weights.bin').async('blob');
                console.log('Извлечен weights.bin');
                const metadataJsonBlob = await zip.file('metadata.json').async('blob');
                console.log('Извлечен metadata.json');

                // Проверяем, что все файлы на месте
                if (!modelJsonBlob || !weightsBinBlob || !metadataJsonBlob) {
                    throw new Error('ZIP-архив должен содержать model.json, weights.bin и metadata.json');
                }

                // Создаем временные URL
                if (modelURL) URL.revokeObjectURL(modelURL);
                if (metadataURL) URL.revokeObjectURL(metadataURL);
                console.log('Старые Object URL отозваны (если были)');

                modelURL = URL.createObjectURL(new File([modelJsonBlob, weightsBinBlob], 'model.json'));
                metadataURL = URL.createObjectURL(metadataJsonBlob);
                console.log('Созданы новые Object URL для модели:', { modelURL, metadataURL });

                statusDiv.textContent = 'Модель готова к запуску!';
                runButton.disabled = false;
                console.log('Кнопка "Запустить" активирована');

            } catch (error) {
                statusDiv.textContent = `Ошибка: ${error.message}`;
                console.error('Произошла ошибка при обработке ZIP:', error);
            }
        });

        // --- 3. Инициализация аудио и модели (ПЕРЕРАБОТАННАЯ ЛОГИКА) ---
        runButton.addEventListener('click', async () => {
            console.log('Кнопка "Запустить" нажата');
            if (!modelURL || !metadataURL) {
                console.error('URL модели или метаданных не установлены');
                statusDiv.textContent = 'Сначала загрузите модель.';
                return;
            }
            runButton.disabled = true;
            statusDiv.textContent = 'Инициализация...';
            console.log('Начало инициализации аудио и модели');

            try {
                // 1. Создаем распознаватель и загружаем модель
                const modelFullURL = modelURL.substring(0, modelURL.lastIndexOf('/') + 1);
                console.log('Создание распознавателя TM с URL:', { modelFullURL, metadataURL });
                recognizer = tmAudio.create(
                    {...window.location, pathname: modelFullURL},
                    metadataURL
                );

                console.log('Ожидание загрузки модели...');
                await recognizer.ensureModelLoaded();
                console.log('Модель успешно загружена.');

                // 2. Запускаем прослушивание, чтобы TM активировала микрофон
                // Это ключевой момент: TM сама создает AudioContext и MediaStream
                statusDiv.textContent = 'Запрос доступа к микрофону...';
                console.log('Запуск recognizer.listen() для активации аудиопотока...');
                recognizer.listen(handlePrediction, {
                    includeSpectrogram: false,
                    probabilityThreshold: 0.90,
                    invokeCallbackOnNoiseAndUnknown: false
                });

                // 3. Получаем AudioContext и MediaStream *из* библиотеки TM
                const audioContext = recognizer.audioContext;
                const stream = recognizer.stream;

                console.log('>>> Получен AudioContext от TM:', audioContext);
                console.log('>>> Получен MediaStream от TM:', stream);

                if (!audioContext || !stream || !stream.active) {
                    throw new Error('Не удалось получить активный аудиопоток от Teachable Machine. Убедитесь, что доступ к микрофону разрешен.');
                }

                // 4. Настраиваем наш AudioWorklet в *том же самом* контексте
                console.log('Настройка AudioWorklet в контексте TM...');
                const workletBlob = new Blob([audioWorkletCode], { type: 'application/javascript' });
                const workletURL = URL.createObjectURL(workletBlob);
                await audioContext.audioWorklet.addModule(workletURL);
                noiseGateWorklet = new AudioWorkletNode(audioContext, 'dynamic-clap-gate');
                console.log('Узел AudioWorklet создан и добавлен в контекст TM.');

                // 5. Строим наш собственный аудиограф, используя поток от TM
                const micSource = audioContext.createMediaStreamSource(stream);
                console.log('Создан MediaStreamSource из потока от TM.');

                // Поток TM -> Наш Worklet (шумодав) -> Динамики
                micSource.connect(noiseGateWorklet);
                noiseGateWorklet.connect(audioContext.destination);
                console.log('✅ Аудиограф успешно соединен: Поток TM -> Worklet -> Динамики');

                statusDiv.textContent = 'Активно: слушаю...';

            } catch (error) {
                statusDiv.textContent = `Ошибка: ${error.message}`;
                console.error('Произошла фатальная ошибка при инициализации:', error);
                runButton.disabled = false;
            }
        });

        // --- 4. Обработка предсказаний ---
        function handlePrediction(result) {
            // Логируем все предсказания для отладки
            // console.log('Получены предсказания:', result.scores);

            for (const pred of result.scores) {
                if ((pred.className.toLowerCase().includes('хлоп') || pred.className.toLowerCase().includes('clap')) && pred.score > 0.95) {
                    console.log(`ОБНАРУЖЕН ХЛОПОК! Класс: "${pred.className}", Уверенность: ${pred.score.toFixed(2)}`);
                    if (noiseGateWorklet) {
                        console.log('Отправка сообщения CLAP_DETECTED в AudioWorklet');
                        noiseGateWorklet.port.postMessage({ type: 'CLAP_DETECTED' });
                    }
                }
            }
        }
    </script>
</body>
</html>
