name: Phoneme Forge live model test

on:
  push:
    branches:
      - gemini-tts-app
    paths:
      - 'phoneme-forge/**'
      - '.github/workflows/phoneme-forge-live.yml'
  pull_request:
    paths:
      - 'phoneme-forge/**'
      - '.github/workflows/phoneme-forge-live.yml'
  workflow_dispatch:

jobs:
  browser-webmaus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install audio and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: node --check phoneme-forge/app.js

      - name: Generate Russian speech fixture
        run: |
          espeak-ng -v ru -s 135 -w /tmp/webmaus-russian.wav 'привет мир'
          ffmpeg -hide_banner -loglevel error -y -i /tmp/webmaus-russian.wav -ac 1 -ar 16000 -c:a pcm_s16le /tmp/sample.wav

      - name: Run page and real WebMAUS browser test
        run: |
          python3 -m http.server 8000 --directory phoneme-forge >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            page.on('console', message => console.log('browser:', message.type(), message.text()));
            page.on('pageerror', error => console.error('pageerror:', error));
            await page.goto('http://127.0.0.1:8000/', { waitUntil: 'networkidle' });
            await page.setInputFiles('#audio', '/tmp/sample.wav');
            await page.fill('#transcript', 'привет мир');
            await page.click('#submit');
            await page.waitForFunction(() => {
              const text = document.querySelector('#status')?.textContent || '';
              return text.startsWith('Готово.') || text.startsWith('Ошибка:');
            }, { timeout: 180000 });
            const status = await page.locator('#status').innerText();
            console.log('FINAL STATUS:', status);
            if (!status.startsWith('Готово.')) throw new Error(status);
            const rowCount = await page.locator('#rows tr').count();
            console.log('SEGMENT ROWS:', rowCount);
            if (rowCount < 3) throw new Error(`Too few aligned rows: ${rowCount}`);
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
