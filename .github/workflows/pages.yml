name: Deploy and verify static site

on:
  push:
    branches:
      - gemini-tts-app
  pull_request:
    branches:
      - gemini-tts-app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public fallback URL
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githack.com/egor125552/html-/gemini-tts-app/audio-to-midi/index.html"
          code="$(curl --silent --show-error --location --max-time 30 \
            -o /tmp/page.html -w '%{http_code}' "$url")"
          echo "Public fallback HTTP status: ${code}"
          test "$code" = "200"
          grep -q 'Аудио в MIDI' /tmp/page.html
          grep -q 'id="saveLink"' /tmp/page.html
          echo "Public converter page is live."

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
