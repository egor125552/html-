name: Deploy and verify static site

on:
  push:
    branches:
      - gemini-tts-app
  pull_request:
    branches:
      - gemini-tts-app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Find an enabled GitHub Pages repository
        shell: bash
        run: |
          set -u
          for repo in=-archipelago- Applio atomic-heart-edition autozakachka-youtube html- silver-guacamole; do
            repo="${repo#=}"
            api="https://api.github.com/repos/egor125552/${repo}/pages"
            code="$(curl --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "/tmp/${repo}.json" -w '%{http_code}' "$api")"
            echo "REPOSITORY=${repo} HTTP=${code}"
            if [ "$code" = "200" ]; then
              cat "/tmp/${repo}.json"
              echo
            fi
          done

      - name: Verify current target URL
        shell: bash
        run: |
          set -uo pipefail
          url="https://egor125552.github.io/html-/audio-to-midi/"
          code="$(curl --silent --show-error --location --max-time 30 \
            -o /tmp/page.html -w '%{http_code}' "$url")"
          echo "Public page HTTP status: ${code}"
          test "$code" = "200"
          grep -q 'Аудио в MIDI' /tmp/page.html

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
