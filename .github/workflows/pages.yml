name: Deploy and verify static site

on:
  push:
    branches:
      - gemini-tts-app
  pull_request:
    branches:
      - gemini-tts-app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Verify batch converter page
        shell: bash
        run: |
          set -euo pipefail
          page="audio-to-midi/index.html"
          test -f "$page"
          grep -q 'Аудио в MIDI' "$page"
          grep -q 'type="file" multiple' "$page"
          grep -q 'id="zipLink"' "$page"
          grep -q 'jszip@3.10.1' "$page"
          grep -q 'Конвертировать все в MIDI' "$page"
          echo "Batch MIDI converter checks passed."

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
